<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#79c8ff" />
    <meta name="description" content="Pop Blocks is a colorful tap game. Find treasures and dodge silly bombs." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Pop Blocks</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="scene" aria-hidden="true">
      <div class="sun"></div>
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>
      <div class="cloud cloud-c"></div>
      <div class="hill"></div>
    </div>

    <main class="app" id="app">
      <div class="stack">
        <header class="top">
          <h1><span aria-hidden="true">⭐</span> Pop Blocks</h1>
          <button type="button" id="mute" aria-pressed="false" aria-label="Sound on">🔊</button>
        </header>

        <section class="stats">
          <div class="chip score" id="score-chip" aria-label="Score 0">
            <span aria-hidden="true">⭐</span>
            <strong id="score">0</strong>
          </div>
          <div class="chip best" id="best-chip" aria-label="Best 0">
            <span aria-hidden="true">🏆</span>
            <strong id="best">0</strong>
          </div>
          <div class="chip bombs" id="bombs-chip" aria-label="Bombs hidden 8">
            <span aria-hidden="true">💣</span>
            <strong id="bombs">8</strong>
          </div>
        </section>

        <div class="levels" role="group" aria-label="How many bombs">
          <button type="button" data-bombs="4" aria-label="Easy, 4 bombs" aria-pressed="false">
            🐣<span>4</span>
          </button>
          <button type="button" data-bombs="8" aria-label="Medium, 8 bombs" aria-pressed="true">
            🐱<span>8</span>
          </button>
          <button type="button" data-bombs="12" aria-label="Hard, 12 bombs" aria-pressed="false">
            🐯<span>12</span>
          </button>
        </div>

        <div class="basket" id="basket" aria-label="Treasures found 0">
          <span class="basket-icon" aria-hidden="true">🧺</span>
          <strong id="found">0</strong>
          <div id="loot" aria-hidden="true"></div>
        </div>

        <div id="board" class="board" role="group" aria-label="Blocks"></div>
      </div>
    </main>

    <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-msg" hidden>
      <canvas id="confetti" aria-hidden="true"></canvas>
      <div class="card">
        <div id="overlay-art" class="art" aria-hidden="true"></div>
        <p id="overlay-msg"></p>
        <div id="overlay-sub" class="sub"></div>
        <button type="button" id="again"><span aria-hidden="true">🔄</span> Play again</button>
        <div class="timer" aria-hidden="true"><span id="timer-fill"></span></div>
      </div>
    </div>

    <div id="fx" aria-hidden="true"></div>
    <div id="flash" aria-hidden="true"></div>

    <noscript>
      <p class="noscript">Pop Blocks needs JavaScript to play.</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
